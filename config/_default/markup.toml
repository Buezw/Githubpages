# -- Markup --
# These settings are required for the theme to function.

[goldmark]
[goldmark.renderer]
  unsafe = true

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 4

# 公式：让 $...$ 和 $$...$$ 原样保留给 KaTeX 渲染（否则下划线、反斜杠会被 Markdown 吃掉）
[goldmark.extensions.passthrough]
  enable = true
  [goldmark.extensions.passthrough.delimiters]
    block = [['\\[', '\\]'], ['\[', '\]'], ['$$', '$$']]
    inline = [['\\(', '\\)'], ['\(', '\)'], ['$', '$']]
