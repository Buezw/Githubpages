{{ $accent := .Accent | default "#cc0000" }}
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
    delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
    ]
});"></script>

<style>
    /* =======================================================
       I. 全局变量与 Reset
       ======================================================= */
    :root {
        --bg: #ffffff;
        --text: #111111;
        --dim: #666666;
        --line: #e5e5e5;
        --accent: {{ $accent }};
        --accent-mi: #cc0000;
        --accent-el: #111111;
        --accent-rl: #0033cc;
        --font-serif: 'Playfair Display', serif;
        --font-body: 'Noto Serif SC', 'Georgia', serif;
        --font-mono: 'JetBrains Mono', monospace;
    }

    html { height: 100%; }

    body {
        margin: 0; padding: 0;
        background-color: var(--bg) !important;
        background-image: none !important;
        color: var(--text);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    a { color: inherit; text-decoration: none; transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    a:hover { color: var(--accent); }

    /* =======================================================
       II. Header
       ======================================================= */
    .site-header {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 26px 20px 18px;
        border-bottom: 3px double var(--text);
        margin-bottom: 20px;
        background: #fff;
        flex-shrink: 0;
    }

    .header-titles {
        flex: 1 1 auto;
        min-width: 0;
        text-align: center;
    }

    .site-nav-spacer {
        visibility: hidden;
    }

    .site-title {
        font-family: var(--font-serif);
        font-size: 2.3rem;
        margin: 0;
        letter-spacing: -1px;
        font-weight: 700;
    }

    .site-title a { color: inherit; }

    .site-subtitle {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 7px;
        color: var(--dim);
    }

    .site-nav {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }
    .site-nav-link {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text);
        padding-bottom: 2px;
        border-bottom: 1px solid transparent;
        white-space: nowrap;
    }
    .site-nav-link.is-active {
        color: var(--accent);
        border-bottom-color: var(--accent);
    }

    @media (max-width: 1400px) {
        .site-header {
            flex-direction: column;
        }
        .site-nav {
            justify-content: center;
        }
        .site-nav-spacer {
            display: none;
        }
    }
    .site-nav-link:hover {
        color: var(--accent);
        border-bottom-color: var(--accent);
    }

    /* =======================================================
       III. 核心布局
       ======================================================= */
    .fluid-wrapper {
        max-width: none !important;
        padding: 0 48px;
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 48px;
        margin-bottom: 56px;
        flex: 1;
    }

    .sidebar { position: sticky; top: 24px; height: fit-content; }
    .profile-name { font-family: var(--font-serif); font-size: 1.7rem; margin: 0 0 12px; }

    .profile-bio { margin-bottom: 22px; }
    .bio-role {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        border-left: 2px solid var(--accent);
        padding-left: 12px;
        margin-bottom: 12px;
        line-height: 1.45;
    }
    .bio-edu {
        font-size: 0.9rem;
        color: var(--dim);
        line-height: 1.6;
    }
    .bio-edu strong { color: var(--text); font-weight: 600; }

    .btn-cv, .btn-back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #111;
        color: #fff;
        padding: 8px 16px;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 0px;
        width: fit-content;
        transition: all 0.2s ease;
    }
    .btn-cv:hover, .btn-back:hover {
        background: var(--accent);
        transform: translateY(-1px);
        color: #fff;
    }
    .btn-back {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--text);
        margin-bottom: 16px;
    }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); background: transparent; }

    .sidebar-section { margin-top: 24px; }
    .sidebar-label {
        font-family: var(--font-mono); font-size: 0.65rem; font-weight: bold;
        text-transform: uppercase; border-left: 3px solid var(--accent);
        padding-left: 10px; margin-bottom: 15px; letter-spacing: 1px;
    }

    .contact-list {
        list-style: none; padding: 0; margin: 0;
        font-family: var(--font-mono); font-size: 0.75rem;
    }
    .contact-list li {
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
    }
    .contact-label {
        font-size: 0.6rem; color: #999; text-transform: uppercase; margin-bottom: 3px; letter-spacing: 0.5px;
    }
    .contact-val {
        color: var(--text);
        word-break: break-all;
    }
    .contact-val a { border-bottom: 1px dotted #ccc; }
    .contact-val a:hover { border-bottom-color: var(--accent); }

    .comp-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-pill { border: 1px solid var(--line); padding: 4px 10px; font-size: 0.75rem; color: var(--dim); }

    /* =======================================================
       IV. Main Content
       ======================================================= */
    .section-header {
        font-family: var(--font-serif); font-size: 1.5rem;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
        margin-bottom: 12px;
        display: flex; justify-content: space-between; align-items: baseline;
    }
    .section-header span { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); letter-spacing: 1.2px; }

    .persona-intro {
        font-size: 0.95rem;
        line-height: 1.75;
        color: var(--text);
        max-width: 68ch;
        margin-bottom: 36px;
    }

    .see-all-link {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent);
        border-bottom: 1px dotted var(--accent);
    }

    .empty-state {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--dim);
        border: 1px dashed var(--line);
        padding: 24px;
        text-align: center;
    }

    /* --- 3-COLUMN GRID (projects) --- */
    .projects-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 36px;
    }

    @media (max-width: 1200px) {
        .projects-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
        .projects-grid { grid-template-columns: 1fr; }
    }

    .project-card {
        background: #fff;
        border: 1px solid #e5e5e5;
        padding: 14px;
        display: flex; flex-direction: column; justify-content: space-between;
        position: relative;
        transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        text-decoration: none !important;
        border-radius: 2px;
        min-height: 118px;
    }

    .project-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .project-card h3 {
        font-family: var(--font-serif);
        font-size: 1.1rem;
        margin: 0 0 6px;
        color: var(--text);
        display: flex; justify-content: space-between; align-items: flex-start;
    }

    .project-card p {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 0.8rem;
        color: var(--dim);
        line-height: 1.5;
        margin-bottom: 10px;
        margin-top: 0;
    }

    .project-keypoints {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        color: #444;
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px dashed #eee;
        letter-spacing: -0.3px;
    }
    .project-keypoints span {
        color: var(--accent);
        margin: 0 4px;
        font-weight: bold;
    }

    .card-footer {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: auto;
    }

    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .card-tag {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        background: #f4f4f4;
        padding: 2px 5px;
        border-radius: 2px;
        color: #333;
    }

    .icon-link svg {
        stroke: #ccc;
        transition: 0.2s;
        width: 14px; height: 14px;
    }
    .project-card:hover .icon-link svg { stroke: var(--accent); }

    /* --- ENTRY LIST (single column, persona pages) --- */
    .entry-list { display: block; }
    .entry-list .entry-item:last-child { border-bottom: none; }

    /* --- TRINITY GRID (homepage hub only) --- */
    .trinity-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 28px;
    }

    .list-group-header {
        font-family: var(--font-mono); font-weight: bold; font-size: 0.85rem;
        text-transform: uppercase; border-bottom: 2px solid #000;
        padding-bottom: 8px; margin-bottom: 16px; display: flex; justify-content: space-between;
    }

    .entry-item { display: block; border-bottom: 1px dashed var(--line); padding-bottom: 12px; margin-bottom: 14px; }
    .entry-meta { font-family: var(--font-mono); font-size: 0.75rem; color: var(--dim); margin-bottom: 8px; display: flex; align-items: center; }
    .meta-tag-mi { color: var(--accent-mi); font-weight: bold; margin-left: 8px; }
    .meta-tag-el { color: var(--accent-el); font-weight: bold; margin-left: 8px; }
    .meta-tag-rl { color: var(--accent-rl); font-weight: bold; margin-left: 8px; border: 1px solid var(--accent-rl); padding: 0 4px; }

    .entry-title {
        font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; line-height: 1.25; color: #000; margin-bottom: 5px;
        overflow-wrap: break-word; word-break: break-word;
    }
    .entry-title-mono {
        font-family: var(--font-mono); font-size: 0.95rem; font-weight: 700; line-height: 1.3; color: #222; margin-bottom: 5px;
        overflow-wrap: break-word; word-break: break-word;
    }

    .entry-summary {
        color: var(--dim);
        font-size: 0.78rem;
        line-height: 1.45;
        font-family: var(--font-mono);
    }

    /* --- ROLE CARDS (homepage hub) --- */
    .role-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }
    @media (max-width: 900px) {
        .role-grid { grid-template-columns: 1fr; }
    }
    .role-card {
        border: 1px solid var(--line);
        padding: 24px;
        display: flex;
        flex-direction: column;
        transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        text-decoration: none !important;
    }
    .role-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .role-card-tag {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 14px;
    }
    .role-card-title {
        font-family: var(--font-serif);
        font-size: 1.5rem;
        color: var(--text);
        margin: 0 0 10px;
    }
    .role-card-desc {
        font-size: 0.85rem;
        color: var(--dim);
        line-height: 1.6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin-bottom: 16px;
        flex: 1;
    }
    .role-card-enter {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text);
    }
    .role-card:hover .role-card-enter { color: var(--accent); }

    @media (max-width: 1400px) { .trinity-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 1000px) {
        .fluid-wrapper { grid-template-columns: 1fr; padding: 0 25px; }
        .sidebar { position: static; }
        .trinity-grid { grid-template-columns: minmax(0, 1fr); }
        .site-title { font-size: 2.2rem; }
    }

    .site-footer {
        text-align: center; padding: 28px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.7rem; color: var(--dim); background: #fff; flex-shrink: 0;
    }
</style>
