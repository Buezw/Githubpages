{{- /* 共用 <head>：传入 dict "title" "description" */ -}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .title }}</title>
{{- with .description }}
<meta name="description" content="{{ . }}">
{{- end }}
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#f3f0ea; --paper2:#ebe6dc; --text:#141414; --dim:#7a7670; --line:#e2ddd4;
  --blue:#1f3a8a; --red:#7a2430;
  --px:clamp(20px,3.2vw,56px);
  --serif:'Source Serif 4','Noto Serif SC',Georgia,serif;
}
/* 大屏：整页按比例放大 */
html{--zoom:1;zoom:var(--zoom)}
@media (min-width:2000px){html{--zoom:1.3}}
@media (min-width:2400px){html{--zoom:1.45}}
*{box-sizing:border-box}
body{margin:0;min-height:calc(100vh / var(--zoom));display:flex;flex-direction:column;background:#fff;color:var(--text);
  font:15px/1.6 'Inter Tight','Noto Sans SC',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.015em}

/* ---------- 顶栏 / 页脚 ---------- */
.topnav{position:relative;z-index:5;display:flex;align-items:center;gap:28px;padding:15px var(--px) 14px;border-bottom:1px solid var(--text);font-size:.9rem;background:#fff}
.brand{display:flex;align-items:center;gap:12px;color:var(--text);flex:none}
.brand b{font-size:1.3rem;line-height:1}
.brand span{color:var(--dim);border-left:1px solid var(--line);padding-left:12px}
.topnav nav{display:flex;gap:26px;margin-left:auto;flex:none}
.topnav nav a{color:var(--text)}
.topnav nav a:hover{color:var(--blue)}
.topnav nav a.on{box-shadow:0 2px 0 var(--text)}

/* 搜索框 + 结果下拉 */
.search{position:relative;flex:1;max-width:520px}
.sbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:6px 12px;color:var(--dim);background:#faf9f6}
.sbox:focus-within{border-color:var(--text);background:#fff}
.sbox input{all:unset;flex:1;min-width:0;font-size:.9rem;color:var(--text)}
.sbox input::placeholder{color:var(--dim)}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sbox kbd{font-family:inherit;font-size:.72rem;border:1px solid var(--line);padding:0 6px;background:#fff;color:var(--dim)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--text);box-shadow:0 12px 30px rgba(20,20,20,.12);max-height:min(70vh,560px);overflow:auto;display:none}
.sres.open{display:block}
.sres a{display:block;padding:10px 14px;border-bottom:1px solid var(--line)}
.sres a:last-child{border-bottom:none}
.sres a.on,.sres a:hover{background:#f6f4ef}
.sres .srt{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sres .srt b{font-weight:500;font-size:.92rem;color:var(--text);min-width:0;overflow-wrap:anywhere}
.sres .srt span{color:var(--dim);font-size:.78rem;white-space:nowrap;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.sres p{margin:3px 0 0;color:var(--dim);font-size:.82rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sres mark{background:#fbeec2;color:inherit;padding:0 1px}
.sres .none{padding:14px;color:var(--dim);font-size:.88rem}
footer{display:flex;justify-content:space-between;padding:12px var(--px) 14px;border-top:1px solid var(--line);color:var(--dim);font-size:.8rem}

/* 小标题行 */
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.8rem;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:2px}
.lab b{font-weight:500;color:var(--text);font-size:.9rem}

/* ---------- 米色左栏 ---------- */
.side{background:var(--paper);padding:40px 24px 22px var(--px);display:flex;flex-direction:column;gap:28px}
.side h1{font-size:2.25rem;line-height:1;margin:0}
.who{color:var(--dim);margin-top:8px;font-size:.9rem;line-height:1.5}
.who b{font-weight:500;color:var(--text)}
.blurb{margin:0;color:#3a3833;font-size:.95rem;line-height:1.6}
.side .lab{border-color:var(--paper2)}
.kit{padding:6px 0;border-bottom:1px solid var(--paper2)}
.kit:last-child{border-bottom:none}
.kit>span{display:block;color:var(--dim);font-size:.78rem;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:#fff;border:1px solid var(--paper2);padding:2px 8px;font-size:.8rem}
.contact{font-size:.9rem;margin-top:8px}
.contact>a{display:block;padding-bottom:6px;border-bottom:1px solid var(--paper2);overflow-wrap:anywhere}
.contact div{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:6px}
.contact a:hover{text-decoration:underline}
.cv{margin-top:auto;align-self:flex-start;border:1px solid var(--text);padding:7px 15px;font-size:.92rem}
.cv:hover{background:var(--text);color:#fff}

/* ---------- 列表 ---------- */
.rs{display:block;padding:7px 0 8px;border-bottom:1px solid var(--line)}
.rs .t{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.rs .t b{font-weight:500;font-size:.95rem;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.rs .t span{color:var(--dim);white-space:nowrap;font-size:.86rem}
.rs p{margin:4px 0 3px;color:var(--dim);font-size:.86rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rs .m{font-size:.78rem;color:var(--red)}
.rs:hover b{color:var(--red)}
.nb .rs{padding:5px 0}
.nb .rs p{-webkit-line-clamp:1}
.nb .rs .m{color:var(--blue)}
.nb .rs:hover b{color:var(--blue)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mrow .m{display:flex;align-items:center;gap:8px;min-width:0}
.area{font-style:normal;font-size:.7rem;font-weight:500;line-height:1.55;white-space:nowrap;color:var(--text)}
.area::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--d)}
.lang{font-style:normal;font-size:.68rem;font-weight:500;letter-spacing:.03em;line-height:1.55;padding:0 6px;border-radius:2px;color:var(--dim);border:1px solid #cfcac1;white-space:nowrap}

.sys{padding:7px 0 8px;border-bottom:1px solid var(--line)}
.sys .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sys .t b{font-weight:500}
.st{font-size:.8rem;white-space:nowrap}
.st::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.ok{color:#2f6b4a}.wip{color:#b06a1e}
.sys .d{color:var(--dim);font-size:.86rem;margin-top:1px}
.sys .m{color:var(--dim);font-size:.78rem}

/* ---------- 顶栏：平板 / 手机 ---------- */
@media (max-width:1100px){
  .topnav{flex-wrap:wrap;row-gap:12px}
  .search{order:3;flex-basis:100%;max-width:none}
}
@media (max-width:760px){
  body{font-size:14.5px}
  .topnav{flex-wrap:wrap;gap:12px 18px;padding-top:13px;padding-bottom:12px}
  .brand span{display:none}
  .topnav nav{gap:16px;flex-wrap:wrap;margin-left:0;order:2;flex-basis:100%}
  .search{order:3;flex-basis:100%;max-width:none}
  .sbox kbd{display:none}
  .nb .rs p{-webkit-line-clamp:2}
}
</style>
