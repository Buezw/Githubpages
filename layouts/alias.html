<!DOCTYPE html>
<html lang="en">
<head>
<title>{{ .Permalink }}</title>
<link rel="canonical" href="{{ .Permalink }}">
<meta name="robots" content="noindex">
<meta charset="utf-8">
{{- /* 跳转地址后面加一个参数：浏览器 / CDN 里旧的跳转缓存不会命中，避免旧旧规则互相跳成死循环 */}}
<meta http-equiv="refresh" content="0; url={{ .Permalink }}?from=redirect">
</head>
<body><a href="{{ .Permalink }}">{{ .Permalink }}</a></body>
</html>
